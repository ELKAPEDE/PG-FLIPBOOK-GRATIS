<header class="top-header">

    <img src="assets/logo-elkapede.png" alt="ELKAPEDE" class="logo">
    <img src="assets/logo-gph.png" alt="GPH" class="logo">

  <nav>

<section class="hero">
  <h1>ELKAPEDE SMP</h1>
  <p>Flipbook digital eksklusif jenjang SMP untuk wilayah Pati.<br>
     Tersedia juga untuk daerah lain yang ingin ikut.</p>
</section>

<section class="mapel-grid" id="smp-jenjang">
  <h2>Pilih Kelas SMP (7–9)</h2>

  <a class="mapel-card" href="#" onclick="showSMPKelas7(); return false;">
    <img src="assets/icon-smp.png" alt="SMP">
    <h3>Kelas 7 — Tersedia</h3>
  </a>
</section>

<section class="mapel-grid" id="smp-kelas7" style="display:none;">
  <h2>SMP Kelas 7</h2>

  <a class="mapel-card" href="https://online.fliphtml5.com/ELKADIGI/ELKAPEDE-7-INDONESIA-S2/" target="_blank">📘 Bahasa Indonesia</a>
  <a class="mapel-card" href="https://online.fliphtml5.com/ELKADIGI/ELKAPEDE-7-IPA-S2/" target="_blank">🧪 IPA</a>
  <a class="mapel-card" href="https://online.fliphtml5.com/ELKADIGI/ELKAPEDE-7-MATEMATIKA-S2/" target="_blank">📐 Matematika</a>
  <a class="mapel-card" href="https://online.fliphtml5.com/ELKADIGI/rwvh/" target="_blank">💻 Koding & AI (KKA)</a>
  <a class="mapel-card" href="https://online.fliphtml5.com/ELKADIGI/ELKAPEDE-7-IPS-S2/" target="_blank">🌍 IPS</a>

  <button class="mapel-card" onclick="backToSMPJenjang()">⬅ Kembali ke SMP</button>
</section>

<script>
function showSMPKelas7(){
  document.getElementById('smp-jenjang').style.display='none';
  document.getElementById('smp-kelas7').style.display='grid';
}
function backToSMPJenjang(){
  document.getElementById('smp-jenjang').style.display='grid';
  document.getElementById('smp-kelas7').style.display='none';
}
</script>
